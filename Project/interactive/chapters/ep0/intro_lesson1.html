<!doctype html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>รู้จักเครื่องหมายคณิตศาสตร์</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; font-family: system-ui, "Noto Sans Thai", sans-serif; color: #30275e; background: radial-gradient(circle at 20% 0%, #fff7c9, transparent 34%), linear-gradient(150deg, #fffdf6, #ebf9ff 55%, #f3edff); }
    main { width: min(1000px, calc(100% - 32px)); margin: auto; padding: clamp(28px, 5vw, 64px) 0; }
    .eyebrow { margin: 0; color: #7963ca; font-size: 12px; font-weight: 900; letter-spacing: .18em; }
    h1 { margin: 6px 0 8px; font-size: clamp(30px, 5vw, 58px); line-height: 1.08; }
    .lead { max-width: 680px; margin: 0; color: #6f6887; font-size: clamp(15px, 2vw, 19px); }
    .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-top: 32px; }
    button { min-height: 210px; padding: 20px 12px; border: 2px solid #e2dcf3; border-radius: 28px; color: inherit; background: rgb(255 255 255 / .82); box-shadow: 0 10px 0 #ddd4f2, 0 18px 36px rgb(72 52 130 / .12); cursor: pointer; transition: .22s ease; }
    button:hover, button:focus-visible { outline: none; transform: translateY(-5px) rotate(-1deg); border-color: #9e89e7; }
    button.is-active { color: white; border-color: #5ccf9e; background: linear-gradient(145deg, #57d7a0, #3eaf92); box-shadow: 0 8px 0 #28866e, 0 18px 36px rgb(39 137 111 / .24); }
    .symbol { display: block; font-size: 78px; font-weight: 900; line-height: 1; }
    strong { display: block; margin-top: 15px; font-size: 19px; }
    small { display: block; margin-top: 5px; opacity: .7; }
    .note { margin-top: 30px; padding: 18px 22px; border: 1px dashed #ab9bdf; border-radius: 20px; color: #625883; background: rgb(255 255 255 / .64); }
    @media (max-width: 720px) { .grid { grid-template-columns: repeat(2, 1fr); } button { min-height: 170px; } }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">INTRO SERVICE · TEST CONTENT</p>
    <h1>เครื่องหมายคณิตศาสตร์ 4 แบบ</h1>
    <p class="lead">ลองแตะการ์ดแต่ละใบเพื่อดูสถานะ Interactive ภายในหน้าเนื้อหานี้ การคลิกทั้งหมดทำงานอยู่ใน iframe และไม่ส่งข้อมูลกลับไปยังบทเรียนหลัก</p>
    <section class="grid" aria-label="เครื่องหมายคณิตศาสตร์">
      <button type="button"><span class="symbol">+</span><strong>บวก</strong><small>นำจำนวนมารวมกัน</small></button>
      <button type="button"><span class="symbol">−</span><strong>ลบ</strong><small>นำจำนวนออกจากกัน</small></button>
      <button type="button"><span class="symbol">×</span><strong>คูณ</strong><small>บวกจำนวนเดิมซ้ำหลายรอบ</small></button>
      <button type="button"><span class="symbol">÷</span><strong>หาร</strong><small>แบ่งออกเป็นกลุ่มเท่า ๆ กัน</small></button>
    </section>
    <p class="note">อ่านและทดลองเสร็จแล้ว ให้กดปุ่ม “ปิด” ด้านบนของ Intro Service เพื่อกลับสู่บทเรียน</p>
  </main>
  <script>
    document.querySelectorAll("button").forEach(button => button.addEventListener("click", () => button.classList.toggle("is-active")));
  </script>
</body>
</html>
