<!doctype html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <title>แถว แผ่น ก้อน — กำลังสองและกำลังสาม</title>
</head>
<body>
  <script data-lesson-app>
    (() => {
      const COLORS = {
        blue: "#4b82d8", blueTop: "#9fc0f0",
        orange: "#efaa43", orangeTop: "#ffe0a3",
        mint: "#65c9b4", mintTop: "#bcebdd",
        answer: "#eaf1ef", tray: "#f5eee1"
      };
      const LAYOUT = { answerX: 0, answerZ: -1.35, sourceX: 0, sourceZ: 5.15 };
      const quiz = [
        question("สร้างพื้นที่ 2²", "area", 2), question("สร้างพื้นที่ 3²", "area", 3),
        question("สร้างพื้นที่ 4²", "area", 4), question("สร้างพื้นที่ 5²", "area", 5), question("สร้างปริมาตร 2³", "volume", 2),
        question("สร้างปริมาตร 3³", "volume", 3), question("สร้างปริมาตร 4³", "volume", 4), question("สร้างปริมาตร 5³", "volume", 5),
        question("ด้านละ 2 หน่วย ปูให้เป็นสี่เหลี่ยมจัตุรัส", "area", 2),
        question("ด้านละ 3 หน่วย ปูให้เป็นสี่เหลี่ยมจัตุรัส", "area", 3),
        question("ใช้แถวละ 2 บล็อก สร้างลูกบาศก์", "volume", 2),
        question("ใช้แถวละ 3 บล็อก สร้างลูกบาศก์", "volume", 3)
      ];
      function question(text, kind, base) {
        return { question: text, data: [{ key: "kind", value: kind }, { key: "base", value: base }] };
      }

      PuzzleLesson.define({
        id: "ep10-lesson3-square-cube",
        version: "2.0.0",
        meta: {
          worldType: "3d-world-space",
          lessonId: "ep10-lesson3-square-cube",
          title: "แถว → แผ่น → ก้อน",
          category: "คณิตศาสตร์",
          subcategory: "กำลังสองและกำลังสาม",
          description: "ลากแถวบล็อกจากถาดด้านล่างไปวางในพื้นที่คำตอบเดียวกัน เพื่อสร้างพื้นที่และปริมาตร",
          keyResult: "ผู้เรียนมองเห็นว่า a² ใช้ a แถว และ a³ ใช้ a ชั้น ชั้นละ a แถว โดยแต่ละแถวมี a บล็อก",
          background: "green",
          camera: { fov: 42, startYaw: 28, startPitch: 55, startDistance: 23.5, minDistance: 13, maxDistance: 33, minPitch: 30, maxPitch: 75, target: [0, .85, .15] },
          welcomeMessage: [
            "ไดโนจะช่วยนับแถว ชั้น และจำนวนบล็อกทั้งหมด",
            "โจทย์อยู่ด้านบน พื้นที่คำตอบอยู่ตรงกลาง",
            "ลากแถวบล็อกจากถาดด้านล่างเข้าไปวาง",
            "ถ้าเป็นกำลังสาม เมื่อชั้นล่างเต็ม แถวต่อไปจะขึ้นชั้นใหม่"
          ],
          tooltip: "ลากแถวบล็อกด้านล่างไปวางในพื้นที่คำตอบ",
          defaultValue: { kind: "area", base: 3 },
          editSchema: [
            { key: "kind", name: "แบบโจทย์", type: "dropdown", option: [
              { value: "area", label: "กำลังสอง — พื้นที่" },
              { value: "volume", label: "กำลังสาม — ปริมาตร" }
            ] },
            { key: "base", name: "จำนวนบล็อกต่อแถว", type: "slider", option: [2, 5], step: 1 }
          ],
          howto: [
            { index: 0, title: "ลากหนึ่งแถว", type: "sequence", desc: "หนึ่งแถวมีบล็อกเท่ากับเลขฐาน ลากจากถาดเข้าพื้นที่คำตอบ", option: { type: "instruction", header: "ไดโนชวนนับแถวและชั้น", message: "หนึ่งแถวมีบล็อกเท่ากับเลขฐาน เติมแถวให้เต็มพื้นสำหรับกำลังสอง และซ้อนชั้นสำหรับกำลังสาม" } },
            { index: 1, title: "เติมให้เต็มชั้น", type: "sequence", desc: "เรียงแถวบนแนวราบจนกว้างและยาวเท่ากัน", option: { type: "instruction", header: "กำลังสองสร้างเป็นพื้นที่", message: "ฐาน n ต้องมี n บล็อกต่อแถวและ n แถว เมื่อเติมเต็มชั้นจะมี n × n = n² บล็อก" } },
            { index: 2, title: "ต่อขึ้นชั้นใหม่", type: "sequence", desc: "กำลังสามใช้แถวเดิม เมื่อชั้นเต็ม แถวต่อไปจะขึ้นด้านบน", option: { type: "instruction", header: "กำลังสามเพิ่มมิติความสูง", message: "นำชั้นขนาด n² มาซ้อนกันอีก n ชั้น จึงได้ n × n × n = n³ บล็อก สังเกตว่าแถวใหม่จะขึ้นชั้นเมื่อพื้นเต็ม" } },
            { index: 3, title: "ลองสร้างเอง", type: "freestyle", desc: "เพิ่ม ลด แยกดู และส่งเมื่อพอใจ", option: { type: "instruction", header: "นับฐาน แถว และชั้น", message: "กำลังสองตรวจฐานกับจำนวนแถว ส่วนกำลังสามตรวจเพิ่มอีกว่ามีครบกี่ชั้น แยกดูได้ถ้าบล็อกด้านในถูกบัง" } }
          ],
          quiz
        },

        mount(context) {
          this.context = context;
          this.worldHandles = [];
          this.uiHandles = [];
          this.rows = [];
          this.countGizmos = [];
          this.selectedCount = 0;
          this.hasInteracted = false;
          this.exploded = false;
          this.effectTimers = [];
          this.transitioningLayer = false;
        },

        reset({ values, mode, question }) {
          this.clearScene();
          this.mode = mode;
          this.question = question || null;
          this.values = this.normalize(values);
          this.kind = this.values.kind;
          this.base = this.values.base;
          this.selectedCount = 0;
          this.hasInteracted = false;
          this.exploded = false;
          this.buildWorkspace({ interactive: mode === "student-quiz" });
        },

        normalize(values = {}) {
          return { kind: values.kind === "volume" ? "volume" : "area", base: Math.min(5, Math.max(2, Math.round(Number(values.base) || 3))) };
        },

        onStep(index) {
          if (this.mode === "student-quiz") return;
          this.clearScene();
          if (index === 0) return this.buildWorkspace({ kind: "area", base: 3, selected: 1, teaching: "source" });
          if (index === 1) return this.buildWorkspace({ kind: "area", base: 3, selected: 3, teaching: "square" });
          if (index === 2) return this.buildWorkspace({ kind: "volume", base: 3, selected: 4, teaching: "stack" });
          this.kind = this.values.kind;
          this.base = this.values.base;
          this.buildWorkspace({ interactive: true, selected: 0 });
        },

        buildWorkspace(options = {}) {
          this.kind = options.kind || this.kind || "area";
          this.base = options.base || this.base || 3;
          this.selectedCount = options.selected || 0;
          this.hasInteracted = false;
          this.rows = [];
          this.exploded = false;
          this.createAnswerArea();
          this.createAxisPreview();
          this.createSourceTray(Boolean(options.interactive));
          for (let index = 0; index < this.selectedCount; index += 1) this.createPlacedRow(index);
          if (options.interactive) this.createControls();
          this.updateUI();
          this.showInstructions(options.teaching);
          if (options.interactive && this.mode !== "student-quiz") this.context.world.showDragCue(this.sourceHandle, [LAYOUT.answerX, .3, LAYOUT.answerZ]);
        },

        createAnswerArea() {
          const cell = this.cellSize();
          const footprint = this.base * cell;
          const width = Math.max(9.2, footprint + 3.25);
          const depth = Math.max(7.1, footprint + 2.75);
          this.answerWidth = width;
          this.answerDepth = depth;
          this.answerZone = this.add(this.context.world.addZone({ name: "answer-area", size: [width, .12, depth], position: [0, .06, LAYOUT.answerZ], color: COLORS.answer, opacity: .48 }));
          const rail = .11;
          const y = .14;
          const edge = this.kind === "area" ? COLORS.mint : COLORS.blue;
          this.add(this.context.world.addBox({ name: "edge-front", size: [width, rail, rail], position: [0, y, LAYOUT.answerZ + depth / 2], color: edge }));
          this.add(this.context.world.addBox({ name: "edge-back", size: [width, rail, rail], position: [0, y, LAYOUT.answerZ - depth / 2], color: edge }));
          this.add(this.context.world.addBox({ name: "edge-left", size: [rail, rail, depth], position: [-width / 2, y, LAYOUT.answerZ], color: edge }));
          this.add(this.context.world.addBox({ name: "edge-right", size: [rail, rail, depth], position: [width / 2, y, LAYOUT.answerZ], color: edge }));
        },

        createAxisPreview() {
          const cell = this.cellSize();
          const span = this.base * cell;
          const left = -span / 2 - .68, right = span / 2 + .68;
          const front = LAYOUT.answerZ + span / 2 + .68, back = LAYOUT.answerZ - span / 2 - .68;
          const lineY = .27;
          this.add(this.context.world.addLineRender({ name: "axis-x", from: [left, lineY, front], to: [right, lineY, front], color: "#ef625c" }));
          this.add(this.context.world.addLineRender({ name: "axis-y", from: [left, lineY, front], to: [left, lineY, back], color: "#477be8" }));
          this.add(this.context.world.addWorldGui({ name: "axis-x-label", text: `X = ${this.base}`, position: [right + .72, .2, front], size: [1.4, .5], color: "#8d2f2b", backgroundColor: "#fff5f2", backgroundOpacity: .94, borderColor: "#ef625c" }));
          this.add(this.context.world.addWorldGui({ name: "axis-y-label", text: `Y = ${this.base}`, position: [left - .75, .2, LAYOUT.answerZ], size: [1.4, .5], color: "#274a9b", backgroundColor: "#f1f5ff", backgroundOpacity: .94, borderColor: "#477be8" }));
          if (this.kind === "volume") {
            const height = this.base * cell;
            this.add(this.context.world.addLineRender({ name: "axis-z", from: [right, lineY, back], to: [right, lineY + height, back], color: "#35a26f" }));
            this.add(this.context.world.addWorldGui({ name: "axis-z-label", text: `Z = ${this.base}`, position: [right + .76, .2, back], size: [1.4, .5], color: "#176a48", backgroundColor: "#effbf5", backgroundOpacity: .94, borderColor: "#35a26f" }));
          }
        },

        createSourceTray(interactive) {
          const cell = this.cellSize();
          const rowWidth = this.base * cell;
          const trayWidth = Math.max(7.2, rowWidth + 2.4);
          this.sourceInteractive = interactive;
          this.add(this.context.world.addZone({ name: "row-tray", size: [trayWidth, .14, 1.75], position: [0, .08, LAYOUT.sourceZ], color: COLORS.tray, opacity: .9 }));
          this.createSourceRow();
          this.sourceFloorLabel = this.add(this.context.world.addWorldGui({
            name: "source-floor-label", text: `ลากกล่องทั้ง ${this.base} ชิ้น`,
            position: [0, .18, LAYOUT.sourceZ - 1.35], size: [3.35, .72]
          }));
        },

        createSourceRow() {
          const cell = this.cellSize();
          const rowWidth = this.base * cell;
          const sourcePalette = this.nextRowPalette();
          let source;
          source = this.add(this.context.world.addGroup({
            name: "source-row", position: [0, .19, LAYOUT.sourceZ], parts: this.rowParts(this.base, sourcePalette[0], sourcePalette[1]),
            draggable: this.sourceInteractive, clickable: this.sourceInteractive, dragAxis: "xz", dragLiftHeight: 1.15, dragFromCenter: true,
            hitArea: [rowWidth + .7, 1.45, 1.55], hitAreaOffset: [0, .5, 0],
            guideTarget: this.mode === "student-quiz" ? null : [0, .28, LAYOUT.answerZ],
            hoverMessage: this.sourceInteractive ? "ลากแถวนี้ไปยังพื้นที่คำตอบ" : "",
            onClick: () => { this.addRow(); this.context.ui.clickme?.restoreFor(source); },
            onDrop: position => {
              const accepted = Math.abs(position.x) <= this.answerWidth / 2 && Math.abs(position.z - LAYOUT.answerZ) <= this.answerDepth / 2;
              source.setPosition(0, .19, LAYOUT.sourceZ);
              if (!accepted) return false;
              this.addRow();
              queueMicrotask(() => this.context?.ui.clickme?.restoreFor(source));
              return { accepted: true, commit: true };
            }
          }));
          this.sourceHandle = source;
          this.sourceClickmeCue?.remove?.();
          this.sourceClickmeCue = this.sourceInteractive && this.context.ui.clickme
            ? this.context.ui.clickme.attach(source, { size: 36, anchor: "bottom", offset: [0, .1, 0] })
            : null;
          this.sourcePaletteKey = sourcePalette.join("|");
          return source;
        },

        createPlacedRow(index) {
          const cell = this.cellSize();
          const layer = this.kind === "volume" ? Math.floor(index / this.base) : 0;
          const row = this.kind === "volume" ? index % this.base : index;
          const palette = layer % 2 === 0 ? [COLORS.blue, COLORS.blueTop] : [COLORS.orange, COLORS.orangeTop];
          const handle = this.add(this.context.world.addGroup({
            name: `placed-row-${index}`,
            position: [0, .19 + layer * cell, LAYOUT.answerZ + ((this.base - 1) / 2 - row) * cell],
            parts: this.rowParts(this.base, palette[0], palette[1])
          }));
          this.rows.push(handle);
          return handle;
        },

        createEquationWorldGui(text = `ผลรวม ${this.selectedCount * this.base} กล่อง`, tone = "primary", state = text) {
          if (this.equationWorldGui) this.removeHandle(this.equationWorldGui);
          this.equationState = state;
          this.equationWorldGui = this.add(this.context.world.addWorldGui({
            name: "answer-result-gui",
            text,
            position: [0, .2, LAYOUT.answerZ + this.answerDepth / 2 - .55],
            size: [5.35, .9],
            fontSize: 90,
            minFontSize: 68,
            textPadding: 30,
            textPaddingY: 24,
            maxLines: 1,
            hoverMessage: "กดเพื่อดูภาพอธิบาย",
            insight: () => ({
              title: `ดูภาพ ${this.powerText()}`,
              message: this.kind === "area"
                ? `${this.base}² คือ ${this.base} แถว แถวละ ${this.base} ก้อน`
                : `${this.base}³ คือ ${this.base} ชั้น แต่ละชั้นมี ${this.base} แถว แถวละ ${this.base} ก้อน`,
              html: `<img class="insight-diagram" src="assets/${this.kind === "area" ? "lesson3-area-axes.svg" : "lesson3-volume-axes.svg"}" alt="ภาพจากแถวไปเป็นรูป ${this.powerText()}"><p class="insight-result"><small>คูณจำนวนในแต่ละทาง</small><strong>${this.resultEquation()}</strong></p>`,
              sections: this.kind === "area" ? [
                { title: "1. ทำหนึ่งแถว", message: `วาง ${this.base} ก้อนต่อกัน` },
                { title: "2. ทำให้เต็มพื้น", message: `ทำทั้งหมด ${this.base} แถว จึงมี ${this.base} × ${this.base} = ${this.base ** 2} ก้อน` }
              ] : [
                { title: "1. ทำหนึ่งแถว", message: `วาง ${this.base} ก้อนต่อกัน` },
                { title: "2. ทำหนึ่งชั้น", message: `ทำ ${this.base} แถว จะได้ ${this.base ** 2} ก้อน` },
                { title: "3. ซ้อนให้ครบ", message: `ซ้อน ${this.base} ชั้น จึงมีทั้งหมด ${this.base ** 3} ก้อน` }
              ],
              primaryLabel: "เข้าใจแล้ว"
            })
          }));
        },

        createControls() {
          this.controls = this.context.ui.control.show({
            id: "row-builder-tools", scope: "step", position: "bottom-right", objectiveAction: false,
            items: this.controlItems(),
            onAction: event => {
              if (event.id === "add") this.addRow();
              if (event.id === "remove") this.removeRow();
              if (event.id === "explode") this.toggleExplode();
              if (event.id === "reset") this.clearRows();
              if (event.id === "submit") this.submitQuiz();
            }
          });
        },

        controlItems() {
          return [
            { id: "add", label: "เพิ่มแถว", icon: "next.svg", disabled: this.transitioningLayer || this.selectedCount >= this.maxRows() },
            { id: "remove", label: "เอาแถวออก", icon: "previous.svg", disabled: this.transitioningLayer || this.selectedCount === 0 },
            { id: "explode", label: this.exploded ? "รวมกลับ" : "แยกดู", icon: this.exploded ? "collapse.svg" : "expand-all.svg", disabled: this.transitioningLayer || this.selectedCount === 0 },
            { id: "reset", label: "เริ่มใหม่", icon: "reset.svg", disabled: this.transitioningLayer || this.selectedCount === 0 },
            ...(this.mode === "student-quiz" ? [{ id: "submit", label: "ส่งรูปนี้", icon: "target.svg", disabled: this.selectedCount === 0 }] : [])
          ];
        },

        addRow() {
          if (this.transitioningLayer || this.selectedCount >= this.maxRows()) return;
          this.placeRow();
        },

        previewNextLayer() {
          this.transitioningLayer = true;
          this.controls?.setItems(this.controlItems());
          const completedLayer = this.rows.slice(-this.base);
          completedLayer.forEach((row, index) => {
            const timer = setTimeout(() => row.playCommit?.(), index * 70);
            this.effectTimers.push(timer);
          });
          ["#b9f48c", "#eaf1ef", "#b9f48c", "#eaf1ef"].forEach((color, index) => {
            const timer = setTimeout(() => this.answerZone?.setColor(color), index * 140);
            this.effectTimers.push(timer);
          });
          this.context.ui.console.set({ objective: `ชั้นที่ ${this.selectedCount / this.base} เต็มแล้ว`, title: "ไดโนเห็นว่าชั้นนี้เต็มแล้ว เตรียมต่อด้านบน", message: "บล็อกและพื้นกำลังกระพริบ แล้วแถวใหม่จะเริ่มชั้นถัดไป", tone: "info" });
          const timer = setTimeout(() => {
            this.transitioningLayer = false;
            this.controls?.setItems(this.controlItems());
          }, 620);
          this.effectTimers.push(timer);
        },

        placeRow() {
          this.hideCountGizmos();
          this.context.world.hideDragCue();
          this.hasInteracted = true;
          const row = this.createPlacedRow(this.selectedCount);
          row.playCommit?.();
          this.selectedCount += 1;
          this.exploded = false;
          this.updateUI();
          if (this.kind === "volume" && this.selectedCount % this.base === 0 && this.selectedCount < this.expectedRows()) {
            this.previewNextLayer();
            return;
          }
          if (this.mode === "student-quiz") {
            this.context.ui.console.set({ objective: `วางแล้ว ${this.selectedCount} แถว`, title: "ยังแก้คำตอบได้", message: "เพิ่มหรือลดแถว แล้วกดส่งเมื่อพอใจ", tone: "info" });
          } else if (this.selectedCount === this.expectedRows()) {
            this.context.audio.play("success");
            this.context.ui.console.set({ objective: this.resultEquation(), title: this.kind === "area" ? "เก่งมาก ไดโนเห็นว่าเต็มพื้นที่แล้ว!" : "เก่งมาก ไดโนนับครบทุกชั้นแล้ว!", message: this.resultExplanation(), tone: "success" });
          } else if (this.kind === "volume" && this.selectedCount % this.base === 0) {
            this.context.ui.console.set({ objective: `ชั้นที่ ${this.selectedCount / this.base} เต็มแล้ว`, title: `ล็อก ${this.base} แถวบนแนวราบ`, message: "แถวต่อไปจะเริ่มวางบนชั้นใหม่", tone: "info" });
          } else {
            this.context.ui.console.set({ objective: `วางแล้ว ${this.selectedCount} แถว`, title: "ลากแถวเดิมมาเพิ่มได้", message: this.kind === "area" ? "สังเกตว่าด้านทั้งสองเท่ากันหรือยัง" : "เมื่อชั้นเต็ม แถวใหม่จะต่อสูงขึ้น", tone: "info" });
          }
        },

        removeRow() {
          this.hideCountGizmos();
          const handle = this.rows.pop();
          if (!handle) return;
          this.removeHandle(handle);
          this.selectedCount -= 1;
          this.exploded = false;
          this.arrangeRows();
          this.setAnswerComplete(false);
          this.updateUI();
          this.context.ui.console.set({ objective: `${this.selectedCount} แถว`, title: "เอาแถวล่าสุดออกแล้ว", message: "แก้ต่อได้ก่อนส่ง", tone: "info" });
        },

        clearRows() {
          this.hideCountGizmos();
          for (const handle of [...this.rows]) this.removeHandle(handle);
          this.rows = [];
          this.selectedCount = 0;
          this.hasInteracted = false;
          this.exploded = false;
          this.setAnswerComplete(false);
          this.updateUI();
          this.context.ui.console.set({ objective: this.powerText(), title: "พื้นที่คำตอบว่างแล้ว", message: "ลากแถวจากถาดด้านล่าง", tone: "info" });
        },

        toggleExplode() {
          if (!this.rows.length) return;
          this.exploded = !this.exploded;
          this.arrangeRows();
          const numbered = this.exploded ? this.showCountGizmos() : (this.hideCountGizmos(), false);
          this.controls?.setItems(this.controlItems());
          this.context.ui.console.set({
            objective: `${this.selectedCount} แถว แถวละ ${this.base} บล็อก`,
            title: this.exploded ? "แยกแถวให้เห็นแล้ว" : "รวมรูปกลับแล้ว",
            message: this.exploded && !numbered ? `มีทั้งหมด ${this.selectedCount * this.base} ก้อน — ซ่อนเลขรายก้อนเพื่อไม่ให้ทับกัน` : "จำนวนบล็อกไม่เปลี่ยน",
            tone: "info"
          });
        },

        arrangeRows() {
          const cell = this.cellSize();
          this.rows.forEach((handle, index) => {
            const layer = this.kind === "volume" ? Math.floor(index / this.base) : 0;
            const row = this.kind === "volume" ? index % this.base : index;
            const rowGap = this.exploded ? .48 : 0;
            const layerGap = this.exploded ? .88 : 0;
            handle.animateTo(0, .19 + layer * (cell + layerGap), LAYOUT.answerZ + ((this.base - 1) / 2 - row) * (cell + rowGap), { duration: 380, arcHeight: .18 });
          });
        },

        showCountGizmos() {
          this.hideCountGizmos();
          if (this.selectedCount * this.base > 16) return false;
          const cell = this.cellSize();
          const rowGap = .48;
          const layerGap = .88;
          let count = 0;
          for (let rowIndex = 0; rowIndex < this.selectedCount; rowIndex += 1) {
            const layer = this.kind === "volume" ? Math.floor(rowIndex / this.base) : 0;
            const row = this.kind === "volume" ? rowIndex % this.base : rowIndex;
            for (let block = 0; block < this.base; block += 1) {
              count += 1;
              const gizmo = this.context.ui.gizmo.at([
                (block - (this.base - 1) / 2) * cell,
                .19 + layer * (cell + layerGap) + cell * .55,
                LAYOUT.answerZ + ((this.base - 1) / 2 - row) * (cell + rowGap)
              ], { id: `cube-count-${count}`, scope: "step", type: "badge", size: "small", priority: 5, text: String(count), tone: "primary" });
              this.countGizmos.push(gizmo);
              this.uiHandles.push(gizmo);
            }
          }
          return true;
        },

        hideCountGizmos() {
          for (const gizmo of this.countGizmos || []) {
            gizmo?.remove?.();
            const index = this.uiHandles.indexOf(gizmo);
            if (index >= 0) this.uiHandles.splice(index, 1);
          }
          this.countGizmos = [];
        },

        updateUI() {
          const solved = this.mode !== "student-quiz" && this.selectedCount === this.expectedRows();
          this.setAnswerComplete(solved);
          this.syncSourcePalette();
          if (this.mode === "student-quiz" || !this.hasInteracted || this.selectedCount === 0) {
            if (this.equationWorldGui) this.removeHandle(this.equationWorldGui);
            this.equationWorldGui = null;
            this.equationState = null;
          } else {
            const calloutState = solved ? "solved" : "building";
            const currentTotal = this.selectedCount * this.base;
            const resultText = `ผลรวม ${currentTotal} กล่อง`;
            if (this.equationState !== calloutState) this.createEquationWorldGui(resultText, solved ? "success" : "primary", calloutState);
            else this.equationWorldGui?.setText?.(resultText);
          }
          this.controls?.setItems(this.controlItems());
        },

        nextRowPalette() {
          const layer = this.kind === "volume" ? Math.floor(this.selectedCount / this.base) : 0;
          return layer % 2 === 0 ? [COLORS.blue, COLORS.blueTop] : [COLORS.orange, COLORS.orangeTop];
        },

        syncSourcePalette() {
          if (!this.sourceHandle) return;
          const palette = this.nextRowPalette();
          const paletteKey = palette.join("|");
          if (paletteKey === this.sourcePaletteKey) return;
          this.removeHandle(this.sourceHandle);
          this.sourceHandle = null;
          this.createSourceRow();
        },

        setAnswerComplete(complete) {
          this.answerZone?.setColor(complete ? "#46d482" : COLORS.answer);
        },

        showInstructions(teaching) {
          const expanded = this.kind === "area" ? `${this.base}² = ${this.base} × ${this.base}` : `${this.base}³ = ${this.base} × ${this.base} × ${this.base}`;
          const text = `${this.kind === "area" ? "สร้างพื้นที่" : "สร้างปริมาตร"}  ${expanded}`;
          this.context.ui.question.show({ label: this.kind === "area" ? `กำลังสอง · ${this.base}²` : `กำลังสาม · ${this.base}³`, text, tone: "primary" });
          const copies = {
            source: ["ลากหนึ่งแถว", `แถวนี้มี ${this.base} บล็อก`, "วางในพื้นที่คำตอบ"],
            square: ["แถวรวมเป็นแผ่น", `${this.base} แถว × ${this.base} บล็อก`, `${this.base}² = ${this.base ** 2} ตารางหน่วย`],
            stack: ["เริ่มชั้นใหม่ด้านบน", `ชั้นล่างครบ ${this.base} แถวแล้ว`, `แถวที่ ${this.base + 1} ต่อสูงขึ้น`]
          };
          const copy = copies[teaching] || (this.mode === "student-quiz" ? ["สร้างรูปแล้วกดส่ง", "ระบบไม่บอกจำนวนแถวที่ถูก", "เพิ่มหรือลดได้จนกว่าจะพอใจ"] : ["ลากแถวด้านล่าง", "วางลงในพื้นที่คำตอบ", "ใช้ปุ่มเพิ่มแถวแทนการลากได้"]);
          this.context.ui.console.set({ objective: copy[0], title: `ไดโนสอน: ${copy[1]}`, message: copy[2], tone: teaching === "square" ? "success" : "info" });
        },

        submitQuiz() {
          if (this.mode !== "student-quiz") return;
          this.context.quiz.answer(this.selectedCount === this.expectedRows(), { kind: this.kind, base: this.base, selectedCount: this.selectedCount, expectedCount: this.expectedRows(), unitCount: this.selectedCount * this.base });
          this.context.ui.console.set({ objective: `ส่งรูป ${this.selectedCount} แถวแล้ว`, title: "ไดโนรับคำตอบเรียบร้อย!", message: "ไปข้อต่อไป หรือเพิ่มลดแถวแล้วส่งใหม่ได้", tone: "info" });
        },

        rowParts(base, color, topColor) {
          const cell = this.cellSize(base);
          return Array.from({ length: base }, (_, index) => ({
            shape: "box", size: [cell - .075, cell - .075, cell - .075],
            position: [(index - (base - 1) / 2) * cell, cell * .5, 0],
            color: index % 2 ? topColor : color, material: { roughness: .5, clearcoat: .18 }
          }));
        },

        cellSize(base = this.base) { return base === 5 ? .7 : base === 4 ? .84 : 1.04; },
        powerText() { return `${this.base}${this.kind === "area" ? "²" : "³"}`; },
        equationText() { return `${this.powerText()} = ?`; },
        expectedRows() { return this.kind === "area" ? this.base : this.base * this.base; },
        maxRows() { return this.mode === "student-quiz" ? this.expectedRows() + this.base : this.expectedRows(); },
        resultEquation() { return `${this.powerText()} = ${this.base ** (this.kind === "area" ? 2 : 3)}`; },
        resultExplanation() { return this.kind === "area" ? `${this.base} แถว × ${this.base} บล็อก = ${this.base ** 2} ตารางหน่วย` : `${this.base} ชั้น × ${this.base} แถว × ${this.base} บล็อก = ${this.base ** 3} ลูกบาศก์หน่วย`; },
        add(handle) { if (handle) this.worldHandles.push(handle); return handle; },
        removeHandle(handle) { const index = this.worldHandles.indexOf(handle); if (index >= 0) this.worldHandles.splice(index, 1); handle?.remove?.(); },

        clearScene() {
          for (const timer of this.effectTimers || []) clearTimeout(timer);
          this.effectTimers = [];
          this.transitioningLayer = false;
          this.context?.world?.hideDragCue?.();
          this.controls?.remove?.();
          this.controls = null;
          for (const handle of this.uiHandles || []) handle?.remove?.();
          for (const handle of this.worldHandles || []) handle?.remove?.();
          this.uiHandles = [];
          this.worldHandles = [];
          this.rows = [];
          this.countGizmos = [];
          this.sourceHandle = null;
          this.answerZone = null;
          this.equationWorldGui = null;
          this.equationState = null;
        },

        dispose() { this.clearScene(); this.context = null; }
      });
    })();
  </script>
</body>
</html>
