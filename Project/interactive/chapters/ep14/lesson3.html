      else if (this.values.figureType === "pyramid") this.createPyramidPanels();
      else if (this.values.figureType === "house") this.createHousePanels();
      else if (this.values.figureType === "cylinder") this.createCylinderPanels();
      else if (this.values.figureType === "cube") this.createCubePanels();
      else if (this.values.figureType === "lprism") this.createLPrismPanels();
      else this.createCuboidPanels();
    },

    framedBoxParts(size, plane) {
      const [w, h, d] = size;
      const edge = .105;
      const lift = .018;
      const gridSize = plane === "xz" ? [w, d] : plane === "xy" ? [w, h] : [d, h];
      const surface = { shape: "sharp-box", size, gridSize };
      if (plane === "xz") return [
        surface,
        { shape: "sharp-box", size: [w + edge, h + lift, edge], position: [0, lift, d / 2], color: FRAME, frame: true },
        { shape: "sharp-box", size: [w + edge, h + lift, edge], position: [0, lift, -d / 2], color: FRAME, frame: true },
        { shape: "sharp-box", size: [edge, h + lift, d], position: [w / 2, lift, 0], color: FRAME, frame: true },
        { shape: "sharp-box", size: [edge, h + lift, d], position: [-w / 2, lift, 0], color: FRAME, frame: true }
      ];
      if (plane === "xy") return [
        surface,
        { shape: "sharp-box", size: [w + edge, edge, d + lift], position: [0, h / 2, lift], color: FRAME, frame: true },
        { shape: "sharp-box", size: [w + edge, edge, d + lift], position: [0, -h / 2, lift], color: FRAME, frame: true },
        { shape: "sharp-box", size: [edge, h, d + lift], position: [w / 2, 0, lift], color: FRAME, frame: true },
        { shape: "sharp-box", size: [edge, h, d + lift], position: [-w / 2, 0, lift], color: FRAME, frame: true }
      ];
      return [
        surface,
        { shape: "sharp-box", size: [w + lift, edge, d + edge], position: [lift, h / 2, 0], color: FRAME, frame: true },
        { shape: "sharp-box", size: [w + lift, edge, d + edge], position: [lift, -h / 2, 0], color: FRAME, frame: true },
        { shape: "sharp-box", size: [w + lift, h, edge], position: [lift, 0, d / 2], color: FRAME, frame: true },
        { shape: "sharp-box", size: [w + lift, h, edge], position: [lift, 0, -d / 2], color: FRAME, frame: true }
      ];
    },

    trianglePanelParts(width, height) {
      const rail = .105, diagonal = Math.sqrt((width / 2) ** 2 + height ** 2);
      const angle = Math.atan2(height, width / 2) * 180 / Math.PI;
      return [
        { shape: "wedge", size: [width / 2, .08, height], gridSize: [width / 2, height], position: [-width / 4, 0, 0], rotation: [0, 180, 0] },
        { shape: "wedge", size: [width / 2, .08, -height], gridSize: [width / 2, height], position: [width / 4, 0, 0] },
        { shape: "sharp-box", size: [width + rail, .09, rail], position: [0, .025, -height / 2], color: FRAME, frame: true },
        { shape: "sharp-box", size: [diagonal, .09, rail], position: [-width / 4, .025, 0], rotation: [0, -angle, 0], color: FRAME, frame: true },
        { shape: "sharp-box", size: [diagonal, .09, rail], position: [width / 4, .025, 0], rotation: [0, angle, 0], color: FRAME, frame: true }
      ];
    },

    surfaceGridRepeat(part) {
      const dimensions = part.gridSize || (part.size || [1, 1, 1]).map(value => Math.abs(Number(value) || 0)).sort((a, b) => b - a).slice(0, 2);
      const cellSize = .42;
      return [Math.max(1, Math.abs(dimensions[0]) / cellSize), Math.max(1, Math.abs(dimensions[1]) / cellSize)];
    },

    panelMaterial(part, color) {
      const frameColor = part.color || FRAME;
      return {
        unlit: !part.frame,
        transparent: false,
        opacity: 1,
        depthWrite: true,
        roughness: part.frame ? .82 : .58,
        clearcoat: part.frame ? .08 : .24,
        clearcoatRoughness: part.frame ? .5 : .34,
        metalness: 0,
        emissive: part.frame ? frameColor : color,
        emissiveIntensity: part.frame ? .08 : .1,
        ...(part.frame ? {} : {
          pattern: "simple-grid",
          patternColors: ["#ffffff", "#315f86", "#ffffff"],
          patternRepeat: part.gridRepeat || this.surfaceGridRepeat(part),
          ...(part.gridOffset ? { patternOffset: part.gridOffset } : {})
        })
      };
    },

    boxSurfaceParts(size, thickness = .055) {
      const [width, height, depth] = size, halfWidth = width / 2, halfHeight = height / 2, halfDepth = depth / 2;
      return [
        { shape: "sharp-box", size: [width, thickness, depth], position: [0, halfHeight, 0], gridSize: [width, depth] },
        { shape: "sharp-box", size: [width, thickness, depth], position: [0, -halfHeight, 0], gridSize: [width, depth] },
        { shape: "sharp-box", size: [width, height, thickness], position: [0, 0, halfDepth], gridSize: [width, height] },
        { shape: "sharp-box", size: [width, height, thickness], position: [0, 0, -halfDepth], gridSize: [width, height] },
        { shape: "sharp-box", size: [thickness, height, depth], position: [halfWidth, 0, 0], gridSize: [depth, height] },
        { shape: "sharp-box", size: [thickness, height, depth], position: [-halfWidth, 0, 0], gridSize: [depth, height] }
      ];
    },

    styleSurfaceParts(parts, color) {
      return parts.map(part => {
        const partColor = part.frame ? (part.color || FRAME) : (part.color || color);
        return { ...part, color: partColor, material: this.panelMaterial(part, partColor) };
      });
    },

    createTexturedShell(name, position, rotation, parts, color) {
      this.modelShellParts ||= [];
      const handle = this.addWorld(this.context.world.addGroup({
        name, position, rotation: rotation || [0, 0, 0], clickable: false, selectionFeedback: false,
        parts: this.styleSurfaceParts(parts, color)
      }));
      if (!this.modelShell) this.modelShell = handle;
      else this.modelShellParts.push(handle);
      return handle;
    },

    createPanel(def) {
      const panel = {
        ...def, color: COLORS[this.panels.length % COLORS.length], accentColor: ACCENT_COLORS[this.panels.length % ACCENT_COLORS.length], selectedFormula: null,
        selectedValue: null, correct: false, group: null
      };
      panel.area = FORMULAS[panel.correctFormula].calculate(...panel.dimensions);
      panel.handle = this.addWorld(this.context.world.addGroup({
        name: `surface-panel-${panel.id}`,
        position: panel.assembledPosition,
        rotation: panel.assembledRotation,
        clickable: false,
        selectionFeedback: false,
        tapToClick: true,
        hitArea: panel.hitArea,
        hoverMessage: "เลือกสูตรพื้นที่ของแผ่นนี้",
        onClick: () => this.handlePanelClick(panel.id),
        parts: this.styleSurfaceParts(panel.parts, panel.color)
      }));
      panel.handle.setClickable(false);
      this.panels.push(panel);
      return panel;
    },

    createCuboidPanels() {
      const a = +this.values.sideA, b = +this.values.sideB, c = +this.values.sideC;
      const scale = 3.45 / Math.max(a, b, c), x = a * scale, z = b * scale, y = c * scale, t = .085;
      const center = [0, .32, -.65];
      this.modelCenter = center; this.modelHeight = y; this.modelFootprint = [x, z];
      const defs = [
        ["bottom", "ด้านล่าง", [a, b], [x, t, z], "xz", [0, 0, 0], [0, 0, 0]],
        ["top", "ด้านบน", [a, b], [x, t, z], "xz", [0, y, 0], [0, 0, 0]],

    createCubePanels() {

    createTriangularPrismPanels() {
      const base = +this.values.sideA, triangleHeight = +this.values.sideB, length = +this.values.sideC;
      const slope = Math.hypot(base / 2, triangleHeight);
      const scale = 3.45 / Math.max(base, triangleHeight, length);
      const x = base * scale, z = triangleHeight * scale, y = length * scale;
      const center = [0, .32, -.65], thickness = .085;
      this.modelCenter = center; this.modelHeight = y; this.modelFootprint = [x, z];
      for (const [id, name, level] of [["bottom", "สามเหลี่ยมฐานล่าง", 0], ["top", "สามเหลี่ยมฐานบน", y]]) {
        this.createPanel({
          id, name, dimensions: [base, triangleHeight], correctFormula: "triangle", flatSize: [x, z],
          assembledPosition: [center[0], center[1] + level, center[2]], assembledRotation: [0, 0, 0], flatRotation: [0, 0, 0],
          hitArea: [x + .25, .35, z + .25], parts: this.trianglePanelParts(x, z)
        });
      }
      [["front", "สี่เหลี่ยมด้านฐานสามเหลี่ยม", base], ["left", "สี่เหลี่ยมด้านเอียงซ้าย", slope], ["right", "สี่เหลี่ยมด้านเอียงขวา", slope]]
        .forEach(([id, name, edge], index) => {
          const width = edge * scale;
          this.createPanel({
            id, name, dimensions: [edge, length], correctFormula: "rectangle", flatSize: [width, y],
            assembledPosition: [center[0], center[1] + y / 2, center[2]], assembledRotation: [0, 0, 0], flatRotation: [0, 0, 0],
            hitArea: [width + .25, .35, y + .25], parts: this.framedBoxParts([width, thickness, y], "xz")
          });
        });
      this.panels.forEach(panel => { panel.shellStart = [center[0], center[1] + y * .5, center[2]]; panel.handle.setVisible(false); });
      const panelById = id => this.panels.find(panel => panel.id === id);
      for (const [id, level] of [["bottom", 0], ["top", y]]) {
        const panel = panelById(id);
        this.createTexturedShell(`surface-triangular-prism-${id}`, [center[0], center[1] + level, center[2]], [0, 180, 0], panel.parts, panel.color);
      }
      const lower = [[-x / 2, center[1], center[2] + z / 2], [x / 2, center[1], center[2] + z / 2], [0, center[1], center[2] - z / 2]];
      const upper = lower.map(point => [point[0], point[1] + y, point[2]]);
      const sideIds = ["front", "right", "left"];
      for (let index = 0; index < 3; index++) {
        const from = lower[index], to = lower[(index + 1) % 3];
        const dx = to[0] - from[0], dz = to[2] - from[2], width = Math.hypot(dx, dz);
        const panel = panelById(sideIds[index]);
        this.createTexturedShell(
          `surface-triangular-prism-${sideIds[index]}`,
          [(from[0] + to[0]) / 2, center[1] + y / 2, (from[2] + to[2]) / 2],
          [0, -Math.atan2(dz, dx) * 180 / Math.PI, 0],
          this.framedBoxParts([width, y, thickness], "xy"), panel.color
        );
        this.createShellEdge(lower[index], lower[(index + 1) % 3], `tri-prism-lower-edge-${index}`);
        this.createShellEdge(upper[index], upper[(index + 1) % 3], `tri-prism-upper-edge-${index}`);
        this.createShellEdge(lower[index], upper[index], `tri-prism-side-edge-${index}`);
      }
    },

      corners.forEach((point, index) => {

      const y0 = center[1], ye = center[1] + y, ya = center[1] + totalY;

      };
      [[points.fl,points.fr],[points.fl,points.fel],[points.fr,points.fer],[points.fel,points.fa],[points.fa,points.fer],

      });
      const lateral = this.createPanel({

        parts: this.styleSurfaceParts(this.framedBoxParts([flatWidth, .085, flatDepth], "xz"), lateral.color)
      }));
      lateral.flatHandle.setVisible(false);

      const stripWidth = flatWidth / CYLINDER_ROLL_STRIPS;
      const [horizontalRepeats, verticalRepeats] = this.surfaceGridRepeat({ gridSize: [flatWidth, flatDepth] });

    cylinderNetPositions() {
      if (!this.cylinderNet) return null;
      const { center, depth, diameter } = this.cylinderNet;
      return new Map([
        ["cylinder-side", [center[0], .16, center[1]]],

    setCylinderRollVisible(panel, visible) {
      (panel?.roll?.handles || []).forEach(handle => handle.setVisible(Boolean(visible)));
    },

    placeCylinderRoll(panel, progress) {
      const roll = panel?.roll;
      if (!roll) return;
      const clamp01 = value => Math.max(0, Math.min(1, value));
      const ease = value => { const t = clamp01(value); return t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; };
      const curl = ease(progress / .82), lay = ease((progress - .28) / .72);
      const phi = Math.PI * 2 * (1 - curl), k = phi / roll.width;
      const startScale = (Math.PI * 2 * roll.radius) / roll.width;
      const visualScale = startScale + (1 - startScale) * curl;
      const beta = Math.PI / 2 * lay;
      const endOrigin = panel.unfoldedPosition || [0, .16, 0];
      const startHinge = [roll.center[0], roll.center[1], roll.center[2] - roll.radius];
      const halfStripWidth = roll.width / roll.count * 1.012 * visualScale / 2;
      const halfStripDepth = roll.depth / 2;
      const halfStripThickness = .055 * visualScale / 2;
      const endHinge = [endOrigin[0], endOrigin[1] - .055 / 2, endOrigin[2] - roll.depth / 2];
      const hinge = startHinge.map((value, axis) => value + (endHinge[axis] - value) * lay);
      let radialEnvelope = halfStripThickness;
      if (phi >= .0001) {
        for (let index = 0; index < roll.count; index++) {
          const s = ((index + .5) / roll.count - .5) * roll.width;
          const theta = k * s;
          const radialZ = (Math.cos(theta) - Math.cos(phi / 2)) / k * visualScale;
          radialEnvelope = Math.max(radialEnvelope,
            radialZ + halfStripWidth * Math.abs(Math.sin(theta)) + halfStripThickness * Math.abs(Math.cos(theta)));
        }
      }
      const origin = [
        hinge[0],
        hinge[1] + halfStripDepth * Math.cos(beta) + radialEnvelope * Math.sin(beta),
        hinge[2] + halfStripDepth * Math.sin(beta)
      ];
      roll.handles.forEach((handle, index) => {
        const s = ((index + .5) / roll.count - .5) * roll.width;
        const x = phi < .0001 ? s : Math.sin(k * s) / k;
        const z = phi < .0001 ? 0 : (Math.cos(k * s) - Math.cos(phi / 2)) / k;
        const yaw = phi < .0001 ? 0 : k * s;
        handle.setPosition(origin[0] + x * visualScale, origin[1] - z * visualScale * Math.sin(beta), origin[2] + z * visualScale * Math.cos(beta));
        handle.setRotation(beta * 180 / Math.PI, yaw * 180 / Math.PI, 0);
        handle.setScale(visualScale, 1, visualScale);
      });
    },

    animateCylinderRoll(panel, from, to, duration, delay = 0) {
      const roll = panel?.roll;
      if (!roll) return;
      const version = ++roll.version;
      panel.handle.setVisible(false);
      panel.flatHandle.setVisible(false);
      this.placeCylinderRoll(panel, from);
      this.setCylinderRollVisible(panel, true);
      const startedAt = Date.now() + delay;
      const tick = () => {
        if (version !== roll.version) return;
        const raw = Math.max(0, Math.min(1, (Date.now() - startedAt) / duration));
        const eased = raw < .5 ? 2 * raw * raw : 1 - Math.pow(-2 * raw + 2, 2) / 2;
        this.placeCylinderRoll(panel, from + (to - from) * eased);
        if (raw < 1) { this.timers.push(setTimeout(tick, 16)); return; }
        this.setCylinderRollVisible(panel, false);
        if (to === 1) {
          panel.flatHandle.setPosition(...panel.unfoldedPosition);
          panel.flatHandle.setRotation(...panel.flatRotation);
          panel.flatHandle.setVisible(true);
        } else {
          panel.handle.setPosition(...panel.assembledPosition);
          panel.handle.setRotation(...panel.assembledRotation);
          panel.handle.setVisible(true);
        }
      };
      this.timers.push(setTimeout(tick, Math.max(0, delay)));
    },

          if (this.sceneState === "assembled" || this.sceneState === "completed") this.unfoldPanels();
          else if (this.sceneState === "unfolded") this.reassembleModel(this.completed);

      });

    createPanelGroups() {
      const map = new Map();
      for (const panel of this.panels) {
        const key = `${panel.correctFormula}:${this.formatNumber(panel.area)}`;
        if (!map.has(key)) map.set(key, []);
        map.get(key).push(panel);
      }
      const entries = [...map.entries()];
      const footprints = entries.map(([, members]) => this.groupFootprint(members));
      const cylinderPositions = this.cylinderNetPositions();
      const positions = cylinderPositions
        ? entries.map(([, members]) => {
          const points = members.map(panel => cylinderPositions.get(panel.id));
          return [points.reduce((sum, point) => sum + point[0], 0) / points.length, .12, points.reduce((sum, point) => sum + point[2], 0) / points.length];
        })
        : this.groupLayout(footprints);
      this.panelGroups = entries.map(([key, members], index) => {
        const group = {
          id: `group-${index}`, key, members, count: members.length,
          correctFormula: members[0].correctFormula, dimensions: members[0].dimensions,
          name: members[0].name, selectedFormula: null, selectedValue: null, correct: false, clickmeCue: null,
          footprint: footprints[index]
        };
        const target = positions[index];
        members.forEach((panel, layer) => {
          panel.group = group;
          panel.unfoldedPosition = cylinderPositions?.get(panel.id) || (() => {
            const spread = this.groupMemberOffset(members, layer);
            return [target[0] + spread[0], .16 + layer * .16, target[2] + spread[1]];
          })();
        });
        group.tray = cylinderPositions ? null : this.createGroupTray(group, target, index);
        const top = members[members.length - 1];
        group.status = this.context.ui.worldGuiSystem.attach(top.flatHandle || top.handle, {
          id: `surface-status-${index}`, scope: "scene", text: `${group.count > 1 ? `${group.count} × ` : ""}??`,
          visible: false, tone: "default", variant: "badge", size: "large", anchor: "center", offset: [0, .34, 0], icon: null,
          onClick: () => this.openFormulaOptions(group)
        });
        group.guide = this.createGroupGuide(group, top);
        this.uiHandles.push(group.status, ...(group.guideLabels || []));
        return group;
      });
      if (cylinderPositions) this.createCylinderNetTray();
    },

    createCylinderNetTray() {
      const net = this.cylinderNet;
      if (!net) return null;
      const width = Math.max(net.width, net.diameter) + 1.25;
      const depth = net.depth + 2 * net.diameter + 1.25;
      const edge = .085, lift = .035, accent = net.lateral.color;
      net.tray = this.addWorld(this.context.world.addGroup({
        name: "surface-cylinder-net-tray", position: [net.center[0], .075, net.center[1]], clickable: false, selectionFeedback: false,
        parts: [
          { shape: "sharp-box", size: [width, .04, depth], color: "#111827", material: { unlit: true, opacity: .6, transparent: true, depthWrite: false, roughness: 1 } },
          { shape: "sharp-box", size: [width, .065, edge], position: [0, lift, -depth / 2], color: accent, material: { unlit: true } },
          { shape: "sharp-box", size: [width, .065, edge], position: [0, lift, depth / 2], color: accent, material: { unlit: true } },
          { shape: "sharp-box", size: [edge, .065, depth], position: [-width / 2, lift, 0], color: accent, material: { unlit: true } },
          { shape: "sharp-box", size: [edge, .065, depth], position: [width / 2, lift, 0], color: accent, material: { unlit: true } }
        ]
      }));
      net.tray.setVisible(false);
      return net.tray;
    },

    addGuideSegment(parts, from, to, thickness = .065) {
      const dx = to[0] - from[0], dz = to[1] - from[1], length = Math.hypot(dx, dz);
      if (length < .03) return;
      parts.push({ shape: "rounded-box", size: [length, .055, thickness],
        position: [(from[0] + to[0]) / 2, 0, (from[1] + to[1]) / 2],
        rotation: [0, -Math.atan2(dz, dx) * 180 / Math.PI, 0], color: "#ffffff",
        geometry: { radius: .02 }, material: { unlit: true } });
    },

    addGuideArrow(parts, from, to) {
      const dx = to[0] - from[0], dz = to[1] - from[1], length = Math.hypot(dx, dz);
      if (length < .25) return;
      const ux = dx / length, uz = dz / length, px = -uz, pz = ux;
      const head = Math.min(.34, length * .13), wing = .2;
      this.addGuideSegment(parts, from, to, .075);
      for (const sign of [-1, 1]) {
        this.addGuideSegment(parts, from, [from[0] + ux * head + px * wing * sign, from[1] + uz * head + pz * wing * sign], .085);
        this.addGuideSegment(parts, to, [to[0] - ux * head + px * wing * sign, to[1] - uz * head + pz * wing * sign], .085);
      }
    },

    createGroupGuide(group, panel) {
      const [width, depth] = panel.flatSize || [2.5, 2];
      const parts = [], margin = .3;
      this.addGuideArrow(parts, [-width / 2, -depth / 2 - margin], [width / 2, -depth / 2 - margin]);
      this.addGuideArrow(parts, [width / 2 + margin, -depth / 2], [width / 2 + margin, depth / 2]);
      const handle = this.addWorld(this.context.world.addGroup({
        name: `surface-dimension-guide-${group.id}`,
        position: [panel.unfoldedPosition[0], panel.unfoldedPosition[1] + .11, panel.unfoldedPosition[2]],
        clickable: false, selectionFeedback: false, parts
      }));
      handle.setVisible(false);
      const unit = this.values.unit;
      const labels = this.dimensionGuideCopy(group);
      group.guideLabels = [
        this.context.ui.worldGuiSystem.at([panel.unfoldedPosition[0], panel.unfoldedPosition[1] + .2, panel.unfoldedPosition[2] - depth / 2 - margin - .24], {
          id: `surface-dimension-x-${group.id}`, scope: "scene", text: `${labels[0]} ${unit}`, visible: false, tone: "primary", variant: "badge", size: "medium"
        }),
        this.context.ui.worldGuiSystem.at([panel.unfoldedPosition[0] + width / 2 + margin + .3, panel.unfoldedPosition[1] + .2, panel.unfoldedPosition[2]], {
          id: `surface-dimension-z-${group.id}`, scope: "scene", text: `${labels[1]} ${unit}`, visible: false, tone: "primary", variant: "badge", size: "medium"
        })
      ];
      return handle;
    },

    dimensionGuideCopy(group) {
      const d = group.dimensions.map(value => this.formatNumber(value));
      if (group.correctFormula === "circle") return [`เส้นผ่านศูนย์กลาง ${d[0]}`, `เส้นผ่านศูนย์กลาง ${d[0]}`];
      if (group.correctFormula === "triangle") return [`ฐาน ${d[0]}`, `สูง ${d[1]}`];
      if (group.correctFormula === "house") return [`กว้าง ${d[0]}`, `สูงรวม ${this.formatNumber((+group.dimensions[1]) + (+group.dimensions[2]))}`];
      if (group.correctFormula === "square") return [`ด้าน ${d[0]}`, `ด้าน ${d[0]}`];
      if (group.correctFormula === "lshape") return [`กว้าง ${d[0]}`, `ยาว ${d[1]}`];
      return [`ยาว ${d[0]}`, `กว้าง ${d[1]}`];
    },

    setGroupGuides(group, visible) {
      group.guide?.setVisible(Boolean(visible));
      (group.guideLabels || []).forEach(label => visible ? label.show() : label.hide());
    },

    groupFootprint(members) {
      const width = Math.max(...members.map(panel => panel.flatSize?.[0] || 2.5));
      const depth = Math.max(...members.map(panel => panel.flatSize?.[1] || 2));
      const offsets = members.map((_, index) => this.groupMemberOffset(members, index));
      const spreadX = offsets.length ? Math.max(...offsets.map(offset => offset[0])) - Math.min(...offsets.map(offset => offset[0])) : 0;
      const spreadZ = offsets.length ? Math.max(...offsets.map(offset => offset[1])) - Math.min(...offsets.map(offset => offset[1])) : 0;
      return [width + spreadX + 1.25, depth + spreadZ + 1.25];
    },

    groupLayout(footprints) {
      const total = footprints.length;
      if (!total) return [];
      const columns = total <= 3 ? total : 2;
      const rows = [];
      for (let index = 0; index < total; index += columns) rows.push([...Array(Math.min(columns, total - index)).keys()].map(offset => index + offset));
      const gapX = 1.35, gapZ = 1.45, centerX = .65, centerZ = .65;
      const rowDepths = rows.map(row => Math.max(...row.map(index => footprints[index][1])));
      const totalDepth = rowDepths.reduce((sum, value) => sum + value, 0) + gapZ * Math.max(0, rows.length - 1);
      const positions = Array(total);
      let zCursor = centerZ - totalDepth / 2;
      rows.forEach((row, rowIndex) => {
        const rowWidth = row.reduce((sum, index) => sum + footprints[index][0], 0) + gapX * Math.max(0, row.length - 1);
        let xCursor = centerX - rowWidth / 2;
        const z = zCursor + rowDepths[rowIndex] / 2;
        row.forEach(index => {
          positions[index] = [xCursor + footprints[index][0] / 2, .12, z];
          xCursor += footprints[index][0] + gapX;
        });
        zCursor += rowDepths[rowIndex] + gapZ;
      });
      return positions;
    },

    createGroupTray(group, target, index) {
      const [width, depth] = group.footprint;
      const accent = group.members[0].color;
      const edge = .085, lift = .035;
      const tray = this.addWorld(this.context.world.addGroup({
        name: `surface-layout-tray-${index}`, position: [target[0], .075, target[2]], clickable: false, selectionFeedback: false,
        parts: [
          { shape: "sharp-box", size: [width, .04, depth], color: "#111827", material: { unlit: true, opacity: .6, transparent: true, depthWrite: false, roughness: 1 } },
          { shape: "sharp-box", size: [width, .065, edge], position: [0, lift, -depth / 2], color: accent, material: { unlit: true } },
          { shape: "sharp-box", size: [width, .065, edge], position: [0, lift, depth / 2], color: accent, material: { unlit: true } },
          { shape: "sharp-box", size: [edge, .065, depth], position: [-width / 2, lift, 0], color: accent, material: { unlit: true } },
          { shape: "sharp-box", size: [edge, .065, depth], position: [width / 2, lift, 0], color: accent, material: { unlit: true } }
        ]
      }));
      tray.setVisible(false);
      return tray;
    },

    groupMemberOffset(members, index) {
      const count = members.length;
      if (count <= 1) return [0, 0];
      const surface = members[0].parts?.find(part => !part.frame) || members[0].parts?.[0] || {};
      const width = Math.abs(Number(surface.size?.[0]) || 3);
      const depth = Math.abs(Number(surface.size?.[2]) || Number(surface.size?.[1]) || 3);
      const fan = index - (count - 1) / 2;
      return [fan * Math.min(.62, Math.max(.3, width * .12)), fan * Math.min(.46, Math.max(.2, depth * .1))];
    },

    setPanelInteraction(enabled) {
      this.panels.forEach(panel => {
        panel.handle.setClickable(Boolean(enabled && !panel.flatHandle));
        panel.flatHandle?.setClickable(Boolean(enabled));
      });
    },

    setAnsweredPanelColor(panel) {
      const selectedColor = this.mode === "student-quiz" ? "#168dff" : panel.accentColor;
      const paint = (handle, surfaceCount) => {
        if (!handle) return;
        handle.setColor(selectedColor);
        const meshes = handle.object3D?.userData?.visualRoot?.children || [];
        for (const mesh of meshes.slice(surfaceCount)) {
          const material = mesh.material;
          if (!material?.color) continue;
          material.color.set(FRAME);
          material.userData?.baseHighlightColor?.copy?.(material.color);
        }
      };
      paint(panel.handle, panel.parts.filter(part => !part.frame).length);
      paint(panel.flatHandle, 1);
    },

    setBaseHover(hovered) {
      const color = hovered ? "#1597ff" : "#ffffff";
      this.modelBase?.setColor(color);
      this.modelBaseArrows?.setColor(color);
    },

    syncGroupClickme(group) {
      group.clickmeCue?.remove?.();
      group.clickmeCue = null;
      if (group.selectedFormula || this.sceneState !== "unfolded") return;
      if (this.mode !== "student-quiz" && this.currentStep < 4) return;
      const panel = group.members[group.members.length - 1];
      const handle = panel?.flatHandle || panel?.handle;
      if (!handle || !this.context.ui.clickme) return;
      group.clickmeCue = this.context.ui.clickme.attach(handle, { size: 29, anchor: "top", offset: [0, .14, 0] });
    },

    syncPanelClickmes() {
      this.panelGroups.forEach(group => this.syncGroupClickme(group));
    },

    clearPanelClickmes() {
      this.panelGroups.forEach(group => { group.clickmeCue?.remove?.(); group.clickmeCue = null; });
    },

    setShellDetailsVisible(visible) {
      (this.modelShellDetails || []).forEach(handle => handle?.setVisible?.(Boolean(visible)));
    },

    shellHandles() {
      return [this.modelShell, ...(this.modelShellParts || [])].filter(Boolean);
    },

    setModelShellVisible(visible) {
      this.shellHandles().forEach(handle => handle.setVisible(Boolean(visible)));
    },

    setModelShellColor(color) {
      this.shellHandles().forEach(handle => handle.setColor(color));
    },

    playModelShellCommit() {
      this.shellHandles().forEach((handle, index) => {
        this.timers.push(setTimeout(() => handle.playCommit?.({ spark: true }), index * 90));
      });
    },

    hidePanelOverlays() {
      this.clearPanelClickmes();
      this.cylinderNet?.tray?.setVisible(false);
      this.panelGroups.forEach(group => {
        group.status?.hide?.();
        this.setGroupGuides(group, false);
        group.tray?.setVisible(false);
      });
    },

    updateToggleControl() {
      if (!this.controls) return;
      const assembled = this.sceneState === "assembled" || this.sceneState === "completed";
      this.controls.setItems([{ id: "toggle-net", label: assembled ? "คลี่รูปทรง" : "ประกอบรูปทรง", icon: "reset.svg", disabled: this.sceneState === "transitioning" }]);
    },

    handlePanelClick(id) {
      if (this.completed || this.sceneState !== "unfolded") return;
      const panel = this.panels.find(item => item.id === id);
      if (panel?.group) this.openFormulaOptions(panel.group);
    },

    unfoldPanels() {
      if (this.sceneState !== "assembled" && this.sceneState !== "completed") return;
      if (this.sceneState === "completed") this.completed = false;
      const transitionVersion = this.transitionVersion = (this.transitionVersion || 0) + 1;
      this.sceneState = "transitioning";
      this.updateToggleControl();
      this.clickmeCue?.complete?.();
      this.modelTapTarget?.setClickable(false);
      this.modelTapTarget?.setVisible(false);
      this.modelBase?.setClickable(false);
      this.modelBase?.setVisible(false);
      this.modelBaseArrows?.setVisible(false);
      this.shapeCallout?.setVisible(false);
      this.finalResultGizmo?.hide?.();
      this.updateAnswer("unfolding");
      this.updateConsole("unfolding");
      this.panelGroups.forEach(group => group.tray?.setVisible(true));
      this.cylinderNet?.tray?.setVisible(true);
      const duration = 680, stagger = 80;
      this.panels.forEach((panel, index) => {
        if (panel.roll) {
          this.animateCylinderRoll(panel, 0, 1, 1100, index * stagger);
          return;
        }
        if (panel.flatHandle) {
          const start = panel.shellStart || panel.assembledPosition;
          panel.handle.setVisible(false);
          panel.flatHandle.stopAnimation?.();
          panel.flatHandle.setPosition(...start);
          panel.flatHandle.setRotation(...panel.flatRotation);
          panel.flatHandle.setVisible(true);
          panel.flatHandle.animateTo(...panel.unfoldedPosition, { duration, delay: index * stagger, arcHeight: .55 });
          return;
        }
        if (panel.shellStart) {
          panel.handle.setPosition(...panel.shellStart);
          panel.handle.setVisible(true);
        }
        panel.handle.stopAnimation?.();
        panel.handle.setRotation(...panel.flatRotation);
        panel.handle.animateTo(...panel.unfoldedPosition, { duration, delay: index * stagger, arcHeight: .55 });
      });
      this.setModelShellVisible(false);
      this.setShellDetailsVisible(false);
      const rollIndex = this.panels.findIndex(panel => panel.roll);
      const transitionTime = Math.max(duration + stagger * (this.panels.length - 1), rollIndex >= 0 ? 1100 + rollIndex * stagger : 0);
      this.timers.push(setTimeout(() => {
        if (transitionVersion !== this.transitionVersion) return;
        this.sceneState = "unfolded";
        this.updateToggleControl();
        this.panels.forEach(panel => { if (panel.flatHandle) { panel.handle.setVisible(false); panel.flatHandle.setVisible(true); } });
        this.setPanelInteraction(this.mode === "student-quiz" || this.currentStep >= 4);
        this.panelGroups.forEach(group => { group.status.show(); this.setGroupGuides(group, true); });
        this.syncPanelClickmes();
        this.updateAnswer("unfolded");
        this.updateConsole("unfolded");
      }, transitionTime + 70));
    },

    openFormulaOptions(group) {
      if (this.sceneState !== "unfolded") return;
      if (this.mode !== "student-quiz" && this.currentStep < 4) return;
      this.activeOption?.remove?.();
      const items = this.formulaChoices(group).map(id => ({ id, icon: FORMULAS[id].icon, label: OPTION_LABELS[id] }));
      const optionPanel = group.members[group.members.length - 1];
      this.activeOption = this.context.ui.worldOption.attach(optionPanel.flatHandle || optionPanel.handle, {
        id: "surface-formula-options", scope: "scene", visible: true, placement: "right", gap: 34, worldOffset: [0, .25, 0],
        title: `เลือกสูตร${group.count > 1 ? `ของ ${group.count} ด้านที่เท่ากัน` : "ของแผ่นนี้"}`,
        message: `${group.name} · ${group.dimensions.map(value => this.formatNumber(value)).join(" × ")} ${this.values.unit}`,
        items, onSelect: event => this.selectFormula(group, event.id)
      });
      if (!group.selectedFormula) this.context.ui.clickme?.restoreFor?.(optionPanel.flatHandle || optionPanel.handle);
    },

    formulaChoices(group) {
      const distractors = {
        rectangle: { near: ["square", "trapezoid"], far: ["triangle", "circle"] },
        square: { near: ["trapezoid"], far: ["triangle", "circle"] },
        triangle: { near: ["trapezoid", "rectangle"], far: ["circle", "square"] },
        house: { near: ["trapezoid", "rectangle"], far: ["circle", "triangle"] },
        circle: { near: ["semicircle"], far: ["triangle", "rectangle"] },
        semicircle: { near: ["circle"], far: ["triangle", "square"] },
        trapezoid: { near: ["rectangle", "square"], far: ["circle", "triangle"] },
        lshape: { near: ["house", "rectangle"], far: ["circle", "triangle"] }
      };
      const family = distractors[group.correctFormula] || { near: ["rectangle"], far: ["circle"] };
      const choices = [group.correctFormula];
      const usedIcons = new Set([FORMULAS[group.correctFormula]?.icon]);
      const pickUniqueIcon = candidates => {
        const available = candidates.filter(id => FORMULAS[id] && !choices.includes(id) && !usedIcons.has(FORMULAS[id].icon));
        if (!available.length) return false;
        const id = available[Math.floor(Math.random() * available.length)];
        choices.push(id);
        usedIcons.add(FORMULAS[id].icon);
        return true;
      };
      pickUniqueIcon(family.near);
      pickUniqueIcon(family.far);
      for (const id of Object.keys(FORMULAS)) {
        if (choices.length >= 3) break;
        pickUniqueIcon([id]);
      }
      return choices
        .map(id => ({ id, order: Math.random() }))
        .sort((a, b) => a.order - b.order)
        .map(item => item.id);
    },

    selectFormula(group, formulaId) {
      const formula = FORMULAS[formulaId];
      if (!formula || this.sceneState !== "unfolded") return;
      group.selectedFormula = formulaId;
      group.selectedValue = +this.formatNumber(formula.calculate(...group.dimensions));
      group.correct = formulaId === group.correctFormula;
      group.members.forEach(panel => this.setAnsweredPanelColor(panel));
      group.tray?.setColor("#168dff");
      group.clickmeCue?.remove?.(); group.clickmeCue = null;
      this.setGroupGuides(group, false);
      group.status.update({
        text: `${group.count > 1 ? `${group.count}×` : ""}${this.formatNumber(group.selectedValue)} = ${this.formatNumber(group.selectedValue * group.count)} ${this.values.unit}²\n${formula.name.replace("พื้นที่", "")}`,
        icon: formula.icon,
        tone: this.mode === "student-quiz" ? "info" : (group.correct ? "success" : "danger"),
        variant: "badge", size: "medium", className: "surface-formula-result"
      }).show();
      this.updateAnswer("unfolded");
      this.evaluateSelections();
    },

    answerExpression(final = false) {
      const terms = this.panelGroups.map(group => {
        const value = group.selectedValue === null ? "??" : this.formatNumber(group.selectedValue);
        return group.count > 1 ? `${group.count}×${value}` : value;
      });
      if (final) return `${this.formatNumber(this.surfaceArea())} ${this.values.unit}²`;
      const selected = this.panelGroups.filter(group => group.selectedFormula).length;
      const visibleTerms = terms.slice(0, 3).join(" + ");
      return `${selected}/${this.panelGroups.length} · ${visibleTerms}${terms.length > 3 ? " + …" : ""}`;
    },

    updateAnswer(stage) {
      const answer = this.context.ui.guiAnswer;
      if (stage === "assembled" || stage === "unfolding") { answer.reset(); answer.hide(); }
      else answer.show({ text: `คำตอบ ${this.answerExpression(false)}` });
    },

    evaluateSelections() {
      const complete = this.panelGroups.every(group => group.selectedFormula);
      if (!complete) {
        this.context.ui.console.feedback(`ไดโนนับให้: เลือกแล้ว ${this.panelGroups.filter(group => group.selectedFormula).length} / ${this.panelGroups.length} กลุ่ม`, { tone: "info" });
        return;
      }
      const correct = this.panelGroups.every(group => group.correct);
      if (this.mode === "student-quiz") this.context.quiz.answer(correct, {
        answer: this.panelGroups.map(group => group.selectedFormula), expected: this.panelGroups.map(group => group.correctFormula),
        complete: true, result: this.surfaceArea(), unit: this.values.unit
      });
      if (!correct) {
        this.context.ui.guiAnswer.wrong({ text: `คำตอบ ${this.formatNumber(this.selectedSum())} ${this.values.unit}² · เลือกใหม่` });
        if (this.mode !== "student-quiz") this.panelGroups.forEach(group => group.status.update({ tone: group.correct ? "success" : "danger" }));
        this.context.ui.console.feedback("ไดโนมีคำใบ้: ตรวจรูปของแผ่น แล้วเลือกสูตรพื้นที่ 2 มิติให้ตรงก่อนรวม", { tone: "warning" });
        return;
      }
      this.completed = true;
      this.setPanelInteraction(false);
      this.context.ui.guiAnswer.correct({ text: `คำตอบ ${this.answerExpression(true)}`, celebrate: true });
      this.context.audio.play("success");
      this.timers.push(setTimeout(() => this.foldCompletedModel(), 900));
    },

    selectedExpression() {
      return `${this.panelGroups.map(group => `${group.count > 1 ? `${group.count} × ` : ""}${this.formatNumber(group.selectedValue || 0)}`).join(" + ")} = ${this.formatNumber(this.selectedSum())} ${this.values.unit}²`;
    },

    reassembleModel(asCompleted = false) {
      if (this.sceneState !== "unfolded") return;
      const transitionVersion = this.transitionVersion = (this.transitionVersion || 0) + 1;
      this.sceneState = "transitioning";
      this.updateToggleControl();
      this.activeOption?.remove?.(); this.activeOption = null;
      this.hidePanelOverlays();
      this.setPanelInteraction(false);
      this.modelBase?.setVisible(true);
      this.modelBase?.setClickable(false);
      this.modelBaseArrows?.setVisible(false);
      if (!asCompleted) { this.context.ui.guiAnswer.reset(); this.context.ui.guiAnswer.hide(); }
      const duration = 660, stagger = 75;
      this.panels.forEach((panel, index) => {
        if (panel.roll) {
          this.animateCylinderRoll(panel, 1, 0, 1050, index * stagger);
          return;
        }
        if (panel.flatHandle) {
          panel.flatHandle.stopAnimation?.();
          panel.flatHandle.setVisible(true);
          panel.flatHandle.setPosition(...panel.unfoldedPosition);
          panel.flatHandle.setRotation(...panel.flatRotation);
          panel.flatHandle.animateTo(...(panel.shellStart || panel.assembledPosition), { duration, delay: index * stagger, arcHeight: .42 });
          return;
        }
        panel.handle.stopAnimation?.();
        panel.handle.setRotation(...(panel.shellStart ? panel.flatRotation : panel.assembledRotation));
        panel.handle.animateTo(...(panel.shellStart || panel.assembledPosition), { duration, delay: index * stagger, arcHeight: .42 });
      });
      const rollIndex = this.panels.findIndex(panel => panel.roll);
      const transitionTime = Math.max(duration + stagger * (this.panels.length - 1), rollIndex >= 0 ? 1050 + rollIndex * stagger : 0);
      this.timers.push(setTimeout(() => {
        if (transitionVersion !== this.transitionVersion) return;
        this.sceneState = asCompleted ? "completed" : "assembled";
        this.hidePanelOverlays();
        if (this.shellHandles().length) {
          this.panels.forEach(panel => { panel.handle.setVisible(false); panel.flatHandle?.setVisible(false); });
          this.setModelShellVisible(true);
          if (asCompleted) this.setModelShellColor("#1aa8d2");
          this.setShellDetailsVisible(true);
          if (asCompleted) this.playModelShellCommit();
        } else if (asCompleted) this.flashPanels();
        this.modelBase?.setClickable(true);
        this.modelBaseArrows?.setVisible(true);
        this.modelTapTarget?.setVisible(true);
        this.modelTapTarget?.setClickable(true);
        this.shapeCallout?.setVisible(!asCompleted);
        if (asCompleted) {
          this.finalResultGizmo?.update({ text: `${this.formatNumber(this.surfaceArea())} ${this.values.unit}²`, tone: "warning", size: "large" }).show();
          this.updateConsole("completed");
        } else {
          this.finalResultGizmo?.hide?.();
          this.clickmeCue?.restore?.();
          this.context.ui.clickme?.restoreFor?.(this.modelTapTarget);
          this.updateConsole("assembled");
        }
        this.updateToggleControl();
      }, transitionTime + 80));
    },

    foldCompletedModel() { this.reassembleModel(true); },

    flashPanels() {
      this.panels.forEach((panel, index) => {
        this.timers.push(setTimeout(() => { panel.handle.setColor("#ffffff"); panel.handle.playCommit?.({ spark: true }); }, index * 55));
        this.timers.push(setTimeout(() => panel.handle.setColor(panel.selectedFormula ? panel.accentColor : panel.color), 300 + index * 55));
      });
    },

    surfaceArea() { return this.panels.reduce((total, panel) => total + panel.area, 0); },
    selectedSum() { return this.panelGroups.reduce((total, group) => total + (group.selectedValue || 0) * group.count, 0); },
    formatNumber(value) { return String(Math.round(Number(value) * 100) / 100); },

    updateQuestion() {
      const a = +this.values.sideA, b = +this.values.sideB, c = +this.values.sideC, unit = this.values.unit, type = this.values.figureType;
      const text = type === "pyramid" ? `ฐาน ${a} ${unit} · สูงเอียง ${b} ${unit} · 1 ฐาน + 4 สามเหลี่ยม`
        : type === "triangularPrism" ? `ฐานสามเหลี่ยม ${a} ${unit} · สูงสามเหลี่ยม ${b} ${unit} · ยาวปริซึม ${c} ${unit}`
        : type === "house" ? `กว้าง ${a} ${unit} · ยาว ${b} ${unit} · สูงรวม ${c} ${unit}`
          : type === "cylinder" ? `รัศมี ${a} ${unit} · สูง ${b} ${unit} · 2 วงกลม + 1 สี่เหลี่ยม`
          : type === "cube" ? `ด้านละ ${a} ${unit} · สี่เหลี่ยมจัตุรัสเท่ากัน 6 หน้า`
          : type === "lprism" ? `ฐานตัว L ${a} × ${b} ${unit} · สูง ${c} ${unit}`
          : `ยาว ${a} ${unit} · กว้าง ${b} ${unit} · สูง ${c} ${unit}`;
      this.context.ui.question.show({ label: `${this.mode === "student-quiz" ? "QUIZ" : "LAB"} · จงหาพื้นที่ผิว${SHAPE_NAMES[type]}`, text, tone: "primary" });
    },

    updateConsole(stage) {
      const count = this.panelGroups.length, faces = this.panels.length;
      const copy = {
        assembled: ["กดฐานใต้โมเดล", `โมเดลทึบนี้ประกอบจากแผ่นตรง ${faces} ด้าน`, "เมื่อฐานสว่างขึ้น สามารถกดเพื่อคลี่ทุกแผ่นได้"],
        unfolding: ["กำลังคลี่โมเดล", "ผิวเดิมกำลังแยกออกอย่างเป็นระเบียบ", "ด้านที่มีขนาดเท่ากันจะวางเหลื่อมกันให้เห็นทุกชั้น"],
        unfolded: ["เลือกสูตรให้ครบ", `${faces} ด้านถูกรวมเป็น ${count} กลุ่ม`, "คลิกกลุ่มแผ่น แล้วเลือกสูตรพื้นที่ 2 มิติ"],
        completed: ["ถูกต้องทุกกลุ่ม", "พื้นที่ผิวคือผลรวมของทุกแผ่น", `คำตอบ ${this.formatNumber(this.surfaceArea())} ${this.values.unit}²`]
      };
      const value = copy[stage] || copy.assembled;
      this.context.ui.console.set({ objective: value[0], title: `${stage === "completed" ? "เก่งมาก ไดโนสรุปได้: " : "ไดโนสอน: "}${value[1]}`, message: value[2], tone: stage === "completed" ? "success" : "info" });
    },

    ensureDecor() {
      if (this.decorLoading) return this.decorLoading;
      const version = this.poolVersion;
      this.decorLoading = (async () => {
        for (const [index, item] of DECOR.entries()) {
          if (version !== this.poolVersion || !this.context) break;
          await new Promise(resolve => setTimeout(resolve, 90));
          if (version !== this.poolVersion || !this.context) break;
          try {
            const handle = await this.context.world.addLibraryObject({ ...item, name: `ep14-scene-decor-${index}`, spawn: false, draggable: false, clickable: false, selectionFeedback: false, debugAreaHidden: true });
            if (version !== this.poolVersion || !this.context) handle.remove(); else this.decorPool.push(handle);
          } catch (error) { console.warn("ep14 decorative asset unavailable", error); }
        }
      })();
      return this.decorLoading;
    },

    onStep(index, step) {
      this.currentStep = index;
      this.updateQuestion();
      if (this.mode === "student-quiz") { this.controls?.show?.(); return; }
      if (index === 0) {
        this.controls?.hide?.();
        this.modelTapTarget?.setClickable(false);
        this.modelBase?.setClickable(false);
        this.updateConsole("assembled");
      } else if (index === 1) {
        this.controls?.hide?.();
        this.modelTapTarget?.setClickable(true);
        if (this.sceneState === "assembled") this.unfoldPanels();
      } else if (index === 2) {
        this.controls?.hide?.();
        this.panelGroups.forEach(group => this.setGroupGuides(group, this.sceneState === "unfolded"));
        this.context.ui.console.set({ objective: "อ่านลูกศรสองหัว", title: "ไดโนบอกใบ้: ตัวเลขคือขนาดจริงของด้าน", message: "นำค่าจากลูกศรไปแทนในสูตรพื้นที่ของแผ่น", tone: "info" });
      } else if (index === 3) {
        this.controls?.hide?.();
        this.context.ui.console.set({ objective: "จับคู่ด้านที่เท่ากัน", title: "ไดโนชวนย่อแผ่นซ้ำเป็น 2× หรือ 4×", message: "คำนวณเพียงหนึ่งแผ่น แล้วคูณด้วยจำนวนแผ่นที่เท่ากัน", tone: "info" });
      } else if (step?.type === "freestyle") {
        this.controls?.show?.();
        if (this.sceneState === "assembled") {
          this.modelTapTarget?.setClickable(true);
          this.modelBase?.setClickable(true);
          this.clickmeCue?.restore?.();
          this.context.ui.clickme?.restoreFor?.(this.modelTapTarget);
        } else if (this.sceneState === "unfolded") {
          this.setPanelInteraction(true);
          this.syncPanelClickmes();
        }
        this.updateConsole(this.sceneState === "unfolded" ? "unfolded" : "assembled");
      }
    },
    addWorld(handle) { if (handle) this.worldHandles.push(handle); return handle; },
    clearTimers() { for (const timer of this.timers || []) clearTimeout(timer); this.timers = []; this.transitionVersion = (this.transitionVersion || 0) + 1; },
    clearScene() {
      this.clearTimers();
      this.activeOption?.remove?.(); this.activeOption = null;
      this.clearPanelClickmes();
      this.context?.ui?.guiAnswer?.reset?.();
      this.context?.ui?.guiAnswer?.hide?.();
      for (const handle of this.uiHandles || []) handle?.remove?.();
      for (const handle of this.worldHandles || []) handle?.remove?.();
      this.uiHandles = []; this.worldHandles = []; this.panels = []; this.panelGroups = [];
      this.clickmeCue?.remove?.(); this.clickmeCue = null;
      this.modelBase = null; this.modelBaseArrows = null; this.modelTapTarget = null; this.modelShell = null; this.modelShellParts = []; this.modelShellDetails = []; this.cylinderNet = null; this.controls = null; this.finalResultGizmo = null; this.completed = false;
      this.shapeCallout = null;
    },
    dispose() {
      this.clearScene(); this.poolVersion++;
      for (const handle of this.decorPool || []) handle?.remove?.();
      this.decorPool = []; this.decorLoading = null; this.context = null;
    }
  });
})();
</script></body>
